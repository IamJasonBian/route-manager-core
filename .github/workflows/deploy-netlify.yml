name: Deploy to Netlify

# Tag-gated release flow:
#   - push to main          → alpha   (continuous dev environment)
#   - tag v*.*.*-<anything> → gamma   (release candidate, e.g. v1.2.3-rc.0)
#   - tag v*.*.*            → prod    (clean semver, e.g. v1.2.3)
#   - workflow_dispatch     → any env (breakglass override)

permissions:
  contents: read
  deployments: write
  statuses: write
  pull-requests: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Breakglass: deploy current ref to this environment'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - gamma
          - prod

env:
  # Alpha site ID (hardcoded as it's not sensitive)
  NETLIFY_SITE_ID_ALPHA: 'b26b3133-30c1-46f3-b976-59ab7c928b57'

jobs:
  # Decide target env from ref shape (tag vs branch) or workflow_dispatch input.
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.set-env.outputs.target_env }}
      release_version: ${{ steps.set-env.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine target environment
        id: set-env
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          EVENT="${{ github.event_name }}"

          # Breakglass: workflow_dispatch input wins over everything.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target_environment }}"
            VERSION="manual-${GITHUB_SHA::7}"
            echo "Breakglass dispatch → $TARGET"
          elif [[ "$REF" == refs/tags/v*.*.* ]]; then
            TAG="${REF#refs/tags/}"
            VERSION="$TAG"
            # Prerelease tags (have a hyphen after the version) → gamma.
            # Clean semver tags → prod.
            if [[ "$TAG" == *-* ]]; then
              TARGET="gamma"
              echo "Prerelease tag $TAG → gamma"
            else
              TARGET="prod"
              echo "Release tag $TAG → prod"
            fi
          elif [[ "$REF" == refs/heads/main || "$REF" == refs/heads/master ]]; then
            TARGET="alpha"
            VERSION="main-${GITHUB_SHA::7}"
            echo "Push to $REF → alpha"
          else
            echo "No deploy target for ref $REF on event $EVENT — skipping."
            TARGET="none"
            VERSION="none"
          fi

          echo "target_env=$TARGET" >> "$GITHUB_OUTPUT"
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"

  deploy-alpha:
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.target_env == 'alpha'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: List Netlify functions before deploy
        run: |
          echo "Listing functions in netlify/functions:";
          find ./netlify/functions -type f -name "*.js" -exec echo " - {}" \;

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Alpha (${{ needs.determine-environment.outputs.release_version }})
        run: netlify deploy --dir=dist --prod --site ${{ env.NETLIFY_SITE_ID_ALPHA }} --message "alpha ${{ needs.determine-environment.outputs.release_version }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: (Non-blocking) Test deployed functions
        run: |
          echo "Testing /test-env endpoint (ignore errors):";
          curl --fail --silent --show-error "https://route-manager-alpha.netlify.app/.netlify/functions/test-env" || echo "test-env endpoint failed (non-blocking)";
          echo "Testing /search-flights endpoint (ignore errors):";
          curl --fail --silent --show-error "https://route-manager-alpha.netlify.app/.netlify/functions/search-flights" || echo "search-flights endpoint failed (non-blocking)";

  deploy-gamma:
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.target_env == 'gamma'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: List Netlify functions before deploy
        run: |
          echo "Listing functions in netlify/functions:";
          find ./netlify/functions -type f -name "*.js" -exec echo " - {}" \;

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Gamma (${{ needs.determine-environment.outputs.release_version }})
        run: netlify deploy --dir=dist --prod --site ${{ secrets.NETLIFY_SITE_ID_GAMMA }} --message "gamma ${{ needs.determine-environment.outputs.release_version }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: (Non-blocking) Test deployed functions
        run: |
          echo "Testing /health endpoint (ignore errors):";
          curl --fail --silent --show-error "https://route-manager-gamma.netlify.app/.netlify/functions/health" || echo "health endpoint failed (non-blocking)";
          echo "Testing /flight-prices endpoint (ignore errors):";
          curl --fail --silent --show-error "https://route-manager-gamma.netlify.app/.netlify/functions/flight-prices?from=JFK&to=LAX" || echo "flight-prices endpoint failed (non-blocking)";

  deploy-prod:
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.target_env == 'prod'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Prod (${{ needs.determine-environment.outputs.release_version }})
        run: netlify deploy --dir=dist --prod --site ${{ secrets.NETLIFY_SITE_ID_PROD }} --message "prod ${{ needs.determine-environment.outputs.release_version }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" || echo "Release may already exist (non-blocking)"

      - name: (Non-blocking) Test deployed functions
        run: |
          echo "Testing /test-env endpoint (ignore errors):";
          curl --fail --silent --show-error "https://route-manager-prod.netlify.app/.netlify/functions/test-env" || echo "test-env endpoint failed (non-blocking)";
          echo "Testing /search-flights endpoint (ignore errors):";
          curl --fail --silent --show-error "https://route-manager-prod.netlify.app/.netlify/functions/search-flights" || echo "search-flights endpoint failed (non-blocking)";
