[build]
  # Build is done in GitHub Actions, not on Netlify
  # command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  port = 3000  # Port for the Netlify dev server
  targetPort = 5173  # Port where Vite runs
  framework = "vite"
  autoLaunch = true
  
  # Environment variables for local development (netlify dev + functions)
  [dev.environment]
    NODE_ENV = "development"
    VITE_API_URL = "/.netlify/functions"
    # Browser origin when using `make dev` / netlify dev (port from [dev] above)
    CORS_ORIGIN = "http://localhost:3000"
    # Amadeus test/sandbox API — use test keys from https://developers.amadeus.com (override in .env if needed)
    AMADEUS_HOSTNAME = "test"

    # These will be loaded from .env file or system environment
    AMADEUS_API_KEY = "${AMADEUS_API_KEY}"
    AMADEUS_API_SECRET = "${AMADEUS_API_SECRET}"

    # Set to "true" locally to exercise flight-prices without Amadeus (see .env.example)
    # USE_MOCK_DATA = "false"
    
    # Database configuration
    DB_USER = "routeuser"
    DB_PASSWORD = "routepass"
    DB_NAME = "routedb"
    DB_HOST = "localhost"
    DB_PORT = "5432"

[functions]
  # Environment variables for Netlify Functions in production
  [functions.environment]
    NODE_ENV = "production"
    AMADEUS_API_KEY = "${AMADEUS_API_KEY}"
    AMADEUS_API_SECRET = "${AMADEUS_API_SECRET}"
    AMADEUS_HOSTNAME = "production"
    
    # Database configuration (should be set in Netlify UI for production)
    DB_USER = "${DB_USER}"
    DB_PASSWORD = "${DB_PASSWORD}"
    DB_NAME = "${DB_NAME}"
    DB_HOST = "${DB_HOST}"
    DB_PORT = "${DB_PORT}"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
